# The edit-and-rerun bundle patch. Adding this package to a profile
# (`dsh plugin --profile <name> add <path-or-tarball>`) activates this layer via
# the dsh.bundle manifest, mounting the plugin over the running composition.
#
# The row carries no `config`: every decision this plugin makes is derived from
# the session snapshot at click time, and the seats it registers into are fixed
# by the host's conversation contract, so there is nothing a deployment could
# vary. The host half is a no-op — the row exists so the loader mounts a real
# cordis plugin and the web plugin table finds the package's `dsh.client`
# declaration and serves `lib/client.js` to the browser.
- insert:
    - id: edit-rerun
      name: '@sumomok/dsh-edit-rerun'
